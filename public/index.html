<body>
<div id="topbar">Mon ⇄ English Dictionary</div>
<input type="text" id="q" placeholder="Enter Mon or English word to search">
<div id="message"></div>
<div id="result" class="hidden"></div>
<div class="logo-container"><img src="mondict.png"></div>

<div id="footer">© 2025-<script>document.write(new Date().getFullYear());</script> JaMonRott | <a href="https://github.com/jamonrott/jamonrott.github.io/releases/download/v2.0.826/MonDict_macOS_v2.0.826.dmg">Mac</a> • <a href="https://github.com/jamonrott/jamonrott.github.io/releases/download/v2.0.826/MonDict_Win_v2.0.826.zip">Windows</a> • <a href="https://apps.apple.com/us/app/moneng-dictionary/id1509441935" target="_blank">iOS</a> • <a href="https://play.google.com/store/apps/details?id=com.jamonrott.memd" target="_blank">Android</a></div>

<script>
let ipaMap = new Map();
if (typeof ipaData !== 'undefined' && ipaData.data) {
    ipaData.data.forEach(item => {
        ipaMap.set(item.word.toLowerCase(), item.ipa);
    });
}

function getPhonetic(word) {
    return ipaMap.get(word.toLowerCase()) || "";
}

function debounce(func, delay = 150) {
    let timeout;
    return (...args) => {
        clearTimeout(timeout);
        timeout = setTimeout(() => func.apply(this, args), delay);
    };
}

document.getElementById("q").addEventListener("input", debounce(function(event) {
    const query = event.target.value.trim().toLowerCase();
    const resultDiv = document.getElementById("result");
    const logoContainer = document.querySelector('.logo-container');
    
    if (query === "") {
        resultDiv.innerHTML = "";
        logoContainer.style.opacity = '0.15';
        return;
    }

    logoContainer.style.opacity = '0';
    let matchCount = 0;
    let htmlBuffer = []; 

    for (let i = 0; i < jsonData.data.length; i++) {
        if (matchCount >= 15) break;
        const item = jsonData.data[i];
        if (item.word.toLowerCase().startsWith(query)) {
            const ipa = getPhonetic(item.word);
            const ipaHtml = ipa ? `<span class='phonetic'>${ipa}</span>` : '';
            htmlBuffer.push(
                `<span class='word'>${item.word}${ipaHtml}</span><br>` + 
                `${makeDefinitionClickable(item.def, query)}<hr>`
            );
            matchCount++;
        }
    }

    if (matchCount === 0) {
        for (let i = 0; i < jsonData.data.length; i++) {
            if (matchCount >= 15) break;
            const item = jsonData.data[i];
            if (item.def.toLowerCase().includes(query)) {
                const ipa = getPhonetic(item.word);
                const ipaHtml = ipa ? `<span class='phonetic'>${ipa}</span>` : '';
                const highlightedDef = highlightMatch(item.def, query);
                htmlBuffer.push(
                    `<span class='word'>${item.word}${ipaHtml}</span><br>` + 
                    `${makeDefinitionClickable(highlightedDef, query)}<hr>`
                );
                matchCount++;
            }
        }
    }

    resultDiv.innerHTML = matchCount > 0 ? htmlBuffer.join("") : "No matches found.";
}, 150));

function highlightMatch(definition, query) {
    const escapedQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return definition.replace(new RegExp(escapedQuery, "gi"), match => `<span class='highlight'>${match}</span>`);
}

function formatDefinitionText(def) {
    if (!def) return '';
    let formatted = def
        .replace(/\s*(\[(?:Cf|Der|id)\.?\])/gi, '<br><strong class="meta-tag">$1</strong> ')
        .replace(/\s+([\u1000-\u109F\uAA60-\uAA7F\s]+?\((?:n|v|vt|vi|adj|adv|prep|conj|interj)\))/gi, '<br><span class="mon-sub">$1</span>')
        .replace(/\s+([a-zA-Z-]+(?:\s+[a-zA-Z-]+)*[\.,]?\s*\((?:n|v|vt|vi|adj|adv|prep|conj|interj|vt[\.,]?vi)\))/gi, '<br><strong class="sub-word">$1</strong>')
        .replace(/\s*([၀-၉0-9]+(?:\s*\([a-z]+\))?[။॥\.]?)\s*/gi, '<br><span class="def-num">$1</span> ')
        .replace(/\s+(n\.|vt\.|vi\.|adj\.|adv\.)\s+/gi, '<br><strong class="pos-tag">$1</strong> ');
    return formatted;
}

function makeDefinitionClickable(definition, query) {
    const cleanDef = formatDefinitionText(definition);

    const parts = cleanDef.split(/(<[^>]+>)/g);

    return parts.map(part => {
        if (part.startsWith("<") && part.endsWith(">")) {
            return part;
        }

        return part.split(" ").map(word => {
            const cleanWord = word.replace(/[၊။().,]/g, '');
            if (cleanWord.toLowerCase() !== query.toLowerCase() && cleanWord !== "") {
                return `<a class='clickable' onclick="searchWord('${cleanWord.replace(/'/g, "\\'")}')">${word}</a>`;
            }
            return word;
        }).join(" ");
    }).join("");
}

function searchWord(word) {
    const searchInput = document.getElementById('q');
    searchInput.value = word;
    searchInput.dispatchEvent(new Event('input'));
}

// Service Worker Registration
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then((reg) => console.log('Service Worker registered:', reg.scope))
      .catch((err) => console.error('Service Worker registration failed:', err));
  });
}
</script>
