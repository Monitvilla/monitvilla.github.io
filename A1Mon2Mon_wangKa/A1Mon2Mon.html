<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A1Mon ⇄ Mon Converter</title>
    <style>
        @font-face {
            font-family: 'A1Mon';
            src: url('a1mon.ttf') format('truetype');
            font-display: swap;
        }

        @font-face {
            font-family: 'Mon';
            src: url('mon.ttf') format('truetype');
            font-display: swap;
        }

        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #a855f7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: rgba(15, 23, 42, 0.6);
            --focus-ring: rgba(99, 102, 241, 0.4);
            --font-a1mon: 'A1Mon', sans-serif;
            --font-mon: 'Mon', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 950px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 16px;
            border: 1px solid var(--card-border);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            padding: 2.25rem;
        }

        header {
            text-align: center;
            margin-bottom: 1.75rem;
        }

        header h1 {
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 0.35rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .mode-toggle {
            display: inline-flex;
            background: rgba(15, 23, 42, 0.8);
            padding: 0.3rem;
            border-radius: 10px;
            border: 1px solid var(--card-border);
        }

        .mode-btn {
            padding: 0.5rem 1.25rem;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 0.875rem;
            font-weight: 600;
            border-radius: 7px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .action-tools {
            display: flex;
            gap: 0.5rem;
        }

        .tool-btn {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .tool-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .converter-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        @media (max-width: 720px) {
            .converter-grid {
                grid-template-columns: 1fr;
            }
            .controls-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .mode-toggle {
                width: 100%;
            }
            .mode-btn {
                flex: 1;
            }
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        label {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: 0.02em;
        }

        textarea {
            width: 100%;
            height: 240px;
            padding: 1rem;
            font-size: 1.15rem;
            line-height: 1.6;
            color: var(--text-main);
            background-color: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .font-a1mon {
            font-family: var(--font-a1mon);
        }

        .font-mon {
            font-family: var(--font-mon);
        }

        textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--focus-ring);
        }

        footer {
            margin-top: 2.25rem;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid var(--card-border);
            padding-top: 1.25rem;
        }

        footer a {
            color: #818cf8;
            text-decoration: none;
            transition: color 0.2s;
        }

        footer a:hover {
            color: #c084fc;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>A1Mon ⇄ Mon Converter</h1>
        <p>Bidirectional real-time font conversion tool</p>
    </header>

    <div class="controls-bar">
        <div class="mode-toggle">
            <button type="button" class="mode-btn active" id="btnA1ToMon" onclick="setMode('a12mon')">A1Mon → Mon</button>
            <button type="button" class="mode-btn" id="btnMonToA1" onclick="setMode('mon2a1')">Mon → A1Mon</button>
        </div>

        <div class="action-tools">
            <button type="button" class="tool-btn" onclick="swapText()">⇄ Swap</button>
            <button type="button" class="tool-btn" onclick="clearFields()">🗑 Clear</button>
            <button type="button" class="tool-btn" id="copyBtn" onclick="copyResult()">📋 Copy</button>
            <button type="button" class="tool-btn" onclick="downloadTxt()">💾 Download</button>
        </div>
    </div>

    <div class="converter-grid">
        <div class="input-group">
            <div class="label-row">
                <label for="txtInput" id="lblInput">A1Mon Input:</label>
            </div>
            <textarea id="txtInput" class="font-a1mon" placeholder="tkjsutjmlikj eaw>njmnj dN.Y$·vií"></textarea>
        </div>

        <div class="input-group">
            <div class="label-row">
                <label for="txtResult" id="lblResult">Mon Output:</label>
            </div>
            <textarea id="txtResult" class="font-mon" readonly placeholder="Converted text will appear here..."></textarea>
        </div>
    </div>

    <footer>
        Created by JaMonRott<br>
        <a href="https://it-villa.blogspot.com" target="_blank">https://it-villa.blogspot.com</a><br><br>
		<a href="https://info.flagcounter.com/gtrh" target="_blank"><img src="https://s01.flagcounter.com/mini/gtrh/bg_00023B/txt_FFFFFF/border_474747/flags_0/" alt="Flag Counter" border="0"></a>
    </footer>
</div>

    function convertText() {
        const inputStr = document.getElementById("txtInput").value;
        const activeMap = (currentMode === 'a12mon') ? a1ToMonMap : monToA1Map;
        let result = "";

        for (let i = 0; i < inputStr.length; i++) {
            let keycode = inputStr.charCodeAt(i);
            if (activeMap[keycode] !== undefined) {
                keycode = activeMap[keycode];
            }
            result += String.fromCharCode(keycode);
        }

        document.getElementById("txtResult").value = result;
    }

    function setMode(mode) {
        currentMode = mode;
        const txtInput = document.getElementById("txtInput");
        const txtResult = document.getElementById("txtResult");
        const lblInput = document.getElementById("lblInput");
        const lblResult = document.getElementById("lblResult");
        const btnA1ToMon = document.getElementById("btnA1ToMon");
        const btnMonToA1 = document.getElementById("btnMonToA1");

        if (mode === 'a12mon') {
            btnA1ToMon.classList.add("active");
            btnMonToA1.classList.remove("active");
            lblInput.innerText = "A1Mon Input:";
            lblResult.innerText = "Mon Output:";
            txtInput.className = "font-a1mon";
            txtResult.className = "font-mon";
            txtInput.placeholder = "tkjsutjmlikj eaw>njmnj dN.Y$·vií";
        } else {
            btnMonToA1.classList.add("active");
            btnA1ToMon.classList.remove("active");
            lblInput.innerText = "Mon Input:";
            lblResult.innerText = "A1Mon Output:";
            txtInput.className = "font-mon";
            txtResult.className = "font-a1mon";
            txtInput.placeholder = "Type or paste Mon text here...";
        }

        convertText();
    }

    function swapText() {
        const txtInput = document.getElementById("txtInput");
        const txtResult = document.getElementById("txtResult");
        const outputVal = txtResult.value;

        setMode(currentMode === 'a12mon' ? 'mon2a1' : 'a12mon');
        txtInput.value = outputVal;
        convertText();
    }

    function clearFields() {
        document.getElementById("txtInput").value = "";
        document.getElementById("txtResult").value = "";
    }

    function copyResult() {
        const outputText = document.getElementById("txtResult").value;
        if (!outputText) return;

        navigator.clipboard.writeText(outputText).then(function() {
            const btn = document.getElementById("copyBtn");
            btn.innerText = "✔ Copied!";
            setTimeout(function() {
                btn.innerText = "📋 Copy";
            }, 2000);
        });
    }

    function downloadTxt() {
        const text = document.getElementById("txtResult").value;
        if (!text) return;

        const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `converted_${currentMode}.txt`;
        a.click();
        URL.revokeObjectURL(a.href);
    }

    document.getElementById("txtInput").addEventListener("input", convertText);
</script>

</body>
</html>
